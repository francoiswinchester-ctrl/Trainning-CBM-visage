<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>CBM-A : Entraînement Local</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background: #1a1a1a; color: white; padding: 20px; }
        .container { max-width: 450px; margin: auto; background: white; padding: 25px; border-radius: 15px; color: #333; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 20px; }
        .face-box { width: 100%; aspect-ratio: 1/1; background: #333; border-radius: 8px; cursor: pointer; overflow: hidden; border: 4px solid transparent; transition: border-color 0.2s; }
        .face-box img { width: 100%; height: 100%; object-fit: cover; pointer-events: none; display: block; }
        #stats { font-size: 1.3rem; margin-bottom: 15px; font-weight: bold; display: flex; justify-content: space-around; border-bottom: 2px solid #eee; padding-bottom: 10px; }
        button { padding: 15px 30px; font-size: 1.1rem; cursor: pointer; background: #27ae60; color: white; border: none; border-radius: 8px; font-weight: bold; margin-top: 20px; }
        button:hover { background: #2ecc71; }
        h1 { margin: 0; font-size: 1.6rem; color: #2c3e50; }
        p { color: #666; font-size: 0.9rem; margin-top: 5px; }
        .score-val { color: #27ae60; }
        .timer-val { color: #e74c3c; }
    </style>
</head>
<body>

<div class="container">
    <h1>Focus Dynamique</h1>
    <p>Trouvez le visage <b>souriant</b> le plus vite possible.</p>
    <div id="stats">
        <span>Score: <span id="score" class="score-val">0</span></span>
        <span>Temps: <span id="timer" class="timer-val">30</span>s</span>
    </div>
    
    <div class="grid" id="grid"></div>
    
    <button id="start-btn" onclick="startGame()">Démarrer la session</button>
</div>

<script>
    let score = 0;
    let timeLeft = 30;
    let timerId;
    const grid = document.getElementById('grid');

    // --- CONFIGURATION DE VOS DOSSIERS ---
    const nbHappy = 68;  
    const nbOther = 420; 
    // -------------------------------------

    function startGame() {
        score = 0; 
        timeLeft = 30;
        document.getElementById('score').textContent = score;
        document.getElementById('timer').textContent = timeLeft;
        document.getElementById('start-btn').style.display = "none";
        generateLevel();
        
        timerId = setInterval(() => {
            timeLeft--;
            document.getElementById('timer').textContent = timeLeft;
            if (timeLeft <= 0) {
                clearInterval(timerId);
                grid.innerHTML = ""; // Vide la grille à la fin
                alert("Session terminée !\n\nScore final : " + score + "\n\nExcellent travail de focalisation !");
                document.getElementById('start-btn').style.display = "inline-block";
                document.getElementById('start-btn').textContent = "Recommencer";
                initStaticGrid();
            }
        }, 1000);
    }

    function generateLevel() {
        grid.innerHTML = "";
        
        // Sélection aléatoire d'une photo Happy
        const happyNum = Math.floor(Math.random() * nbHappy) + 1;
        const happyPath = "Happy/Happy (" + happyNum + ").jpg";
        
        // Position aléatoire du sourire (0 à 8)
        const winningIndex = Math.floor(Math.random() * 9);

        for (let i = 0; i < 9; i++) {
            const box = document.createElement('div');
            box.className = 'face-box';
            const img = document.createElement('img');
            
            if (i === winningIndex) {
                img.src = happyPath;
                box.onclick = () => { 
                    score++; 
                    document.getElementById('score').textContent = score; 
                    generateLevel(); 
                };
            } else {
                // Sélection aléatoire d'une photo Other
                const otherNum = Math.floor(Math.random() * nbOther) + 1;
                img.src = "Other/Other (" + otherNum + ").jpg";
                box.onclick = (e) => { 
                    if(score > 0) score--; 
                    document.getElementById('score').textContent = score; 
                    box.style.borderColor = "#e74c3c"; 
                    // Efface la bordure rouge après 500ms
                    setTimeout(() => { box.style.borderColor = "transparent"; }, 500);
                };
            }
            
            // Sécurité si une photo est mal nommée ou absente
            img.onerror = function() {
                this.src = "https://via.placeholder.com/150?text=Erreur";
            };

            box.appendChild(img);
            grid.appendChild(box);
        }
    }

    function initStaticGrid() {
        grid.innerHTML = "";
        for (let i = 0; i < 9; i++) {
            const box = document.createElement('div');
            box.className = 'face-box';
            grid.appendChild(box);
        }
    }

    // Initialisation au chargement
    initStaticGrid();
</script>
</body>
</html>
